name: Verify AFTERSHOCK
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: docker compose -f compose.yaml -f compose.dev.yaml up -d --wait falkordb main rollback restart fallback
      - run: RUN_INTEGRATION=1 python -m pytest -q
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
